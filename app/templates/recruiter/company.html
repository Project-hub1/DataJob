{% extends 'base.html' %}{% block title %}Company Profile — CareerHub{% endblock %}{% block content %}<section class="section"><div class="form-wrap wide"><div class="panel"><p class="eyebrow">COMPANY PROFILE</p><h1>{% if company %}Edit company{% else %}Create company{% endif %}</h1><p class="muted">Candidates see this information on your company page.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="form-grid"><label>Company name<input class="input" name="name" maxlength="180" value="{{company.name if company else ''}}" required></label><label>Industry<input class="input" name="industry" maxlength="120" value="{{company.industry if company else 'Information Technology'}}" required></label><label>Location<input class="input" name="location" maxlength="160" value="{{company.location if company else ''}}" required></label><label>Website<input class="input" name="website" maxlength="255" value="{{company.website if company else ''}}" placeholder="https://example.com"></label><label>Employee count<input class="input" type="number" name="employee_count" min="0" max="100000000" value="{{company.employee_count if company else ''}}" placeholder="e.g. 250"></label><label>Your name<input class="input" name="recruiter_name" maxlength="120" value="{{current_user.recruiter_profile.full_name if current_user.recruiter_profile else ''}}" placeholder="Your full name"></label><label>Designation<input class="input" name="designation" maxlength="120" value="{{current_user.recruiter_profile.designation if current_user.recruiter_profile else 'Recruiter'}}" placeholder="e.g. Talent Acquisition Manager"></label></div><label>Description<textarea class="input" name="description" rows="8" maxlength="5000" placeholder="Tell candidates what your company does.">{{company.description if company else ''}}</textarea><div class="notice" style="margin-top:4px"><strong>Changes are saved to your recruiter account.</strong><br><span class="muted">You can return here anytime to update company information, recruiter details, website, employee count or description.</span></div><button class="btn">{% if company %}Save changes{% else %}Create company{% endif %}</button></form>{% if company %}<div class="notice success"><strong>Company is live.</strong><br><span class="muted">Saving your company profile approves it immediately, so you can publish jobs and have them appear on the homepage.</span></div><p class="muted">Approval status: <span class="status">{{company.approval_status}}</span>{% if company.employee_count %} · {{company.employee_count}} employees{% endif %}</p>{% endif %}</div></div></section>{% endblock %}
