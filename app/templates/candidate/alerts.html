{% extends 'base.html' %}{% block title %}Job Alerts — CareerHub{% endblock %}{% block content %}<section class="section"><div class="detail-grid"><div class="panel"><h1>Create a job alert</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input class="input" name="keyword" placeholder="Keyword e.g. Python Developer"><input class="input" name="location" placeholder="Location e.g. Delhi"><button class="btn">Create alert</button></form></div><div class="panel"><h2>Your alerts</h2>{% for a in alerts %}<div class="list-row"><div><b>{{a.keyword or 'Any job'}}</b><small>{{a.location or 'Any location'}}</small></div><form method="post" action="{{url_for('candidate.delete_alert',alert_id=a.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="icon-btn">×</button></form></div>{% else %}<p class="muted">No alerts yet.</p>{% endfor %}</div></div></section>{% endblock %}
