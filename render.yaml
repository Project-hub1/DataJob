services:
  - type: web
    name: careerhub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python production_start.py
    healthCheckPath: /health
    envVars:
      - key: CAREERHUB_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerhub-db
          property: connectionPoolString
      - key: APP_BASE_URL
        fromService:
          name: careerhub
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEV_SHOW_RESET_LINK
        value: "0"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: REMEMBER_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: AUTO_CREATE_DB
        value: "0"
      - key: AUTO_APPROVE_RECRUITER_COMPANIES
        value: "0"
      - key: HEALTHCHECK_ENABLED
        value: "1"
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "1"
      - key: MAIL_FROM
        sync: false

databases:
  - name: careerhub-db
    plan: basic-256mb
    connectionPool: pgbouncer

# Production note: SMTP can be enabled later by filling the sync:false values above.
